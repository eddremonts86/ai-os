# Which local Coolify apps track which branch of which repo.
#
#   <coolify-app-name>  <github-owner/repo>  <branch>
#
# The Coolify app NAME, not its UUID. UUIDs are resolved at run time from
# GET /api/v1/applications, because a stored one points at whichever app was
# provisioned last and deploying to the wrong app succeeds without complaining.
#
# Only the local replica belongs here. Production is deployed by each repo's
# own GitHub Actions workflow, which a runner in GitHub's cloud can reach and
# this Mac has nothing to do with.
#
# Lines starting with # are ignored, as are blank ones.

enforma                eddremonts86/enForma                dev
enforma-pocketbase     eddremonts86/enForma                dev

# The rest still track their production branch in Coolify. Move each one to
# `dev` in the Coolify UI first, then change it here — a mismatch means this
# poller watches one branch while Coolify builds another, which looks like the
# deploy silently doing nothing.
#
# ai-chat                eddremonts86/ai-schadcn-chat        dev
# ai-os-landing          eddremonts86/ai-os                  dev
# ai-os-plans-explorer   eddremonts86/ai-os                  dev
# ai-os-submission-api   eddremonts86/ai-os                  dev
# builderhunt            eddremonts86/builderhunt            dev
# edd-remonts-dashboard  eddremonts86/edd-remonts-dashboard  dev
# geo-local              eddremonts86/geoLocal               dev
# geo-local-scraper      eddremonts86/geoLocal               dev
# hunterready            eddremonts86/hunterready            dev
