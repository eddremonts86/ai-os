name: Test Windows

on:
  pull_request:
    # dev too: the plans pipeline promotes through dev, and it refuses to merge
    # unless checks are green. With main-only triggers the dev hop saw no test
    # run at all, so that guard was satisfied by a check that proved nothing.
    branches: [main, dev]
  push:
    branches: [main]
  # On demand. Direct pushes to dev trigger nothing — only PRs and pushes to main do — so 15
  # commits can land on dev with no CI signal at all, which is exactly what happened. This makes
  # the Linux and Windows checks runnable without opening a PR first.
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install yq
        # Use mikefarah/yq v4 (not choco which can be old/incompatible)
        run: |
          $yqUrl = "https://github.com/mikefarah/yq/releases/latest/download/yq_windows_amd64.exe"
          $yqPath = "$env:USERPROFILE\yq.exe"
          Invoke-WebRequest -Uri $yqUrl -OutFile $yqPath -UseBasicParsing
          $env:PATH = "$env:USERPROFILE;$env:PATH"
          & $yqPath --version

      - name: Install PyYAML
        run: pip install pyyaml

      - name: PowerShell syntax check (all setup/*.ps1, required, fail-closed)
        # Parses every .ps1 under setup/ with the real PowerShell parser. This
        # is what would have caught the verify-windows.ps1 "$label:" ambiguous
        # variable-reference bug (PowerShell tries to read "label" as a drive/
        # scope prefix) before it shipped — that file is never exercised for
        # real by the DRY_RUN step below, so nothing else in this workflow
        # checks its syntax.
        run: |
          $files = Get-ChildItem -Path setup -Filter *.ps1 -Recurse
          $failed = $false
          foreach ($f in $files) {
            $tokens = $null; $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $failed = $true
              Write-Host "::error file=$($f.FullName)::Parse errors:"
              $errors | ForEach-Object { Write-Host "  Line $($_.Extent.StartLineNumber): $($_.Message)" }
            } else {
              Write-Host "OK: $($f.FullName)"
            }
          }
          if ($failed) { exit 1 }

      - name: Run install-windows.ps1 (DRY_RUN)
        env:
          DRY_RUN: "1"
        run: pwsh -File ./setup/install-windows.ps1

      - name: Verify ECC integration (--check)
        # Non-fatal: ECC may not be vendored on every PR. We log a warning instead
        # of failing the build so that PRs touching unrelated files stay green.
        run: |
          if (Test-Path vendor/ecc) {
            Write-Host "vendor/ecc/ present, running bash setup/install-ecc.sh --check..."
            bash setup/install-ecc.sh --check
          } else {
            Write-Host "::warning::vendor/ecc/ not present; skipping ECC --check (this is OK if the PR doesn't touch ECC integration)."
          }

      - name: Verify claude.tools / gstack integration (--check)
        # Non-fatal: vendor/codex-plugin-cc/ may not be cloned on every PR.
        # The 12 individual skills live in ai-config/skills/ (checked in), so
        # the frontmatter checks always run; the plugin-level check is conditional.
        run: |
          if (Test-Path vendor/codex-plugin-cc) {
            Write-Host "vendor/codex-plugin-cc/ present, running bash setup/install-claude-tools.sh --check..."
            bash setup/install-claude-tools.sh --check
            if ($LASTEXITCODE -ne 0) { Write-Host "::warning::install-claude-tools.sh --check exited non-zero (non-fatal)" }
          } else {
            Write-Host "::warning::vendor/codex-plugin-cc/ not present; running --check anyway (12 individual skills are in ai-config/skills/)"
            bash setup/install-claude-tools.sh --check
            if ($LASTEXITCODE -ne 0) { Write-Host "::warning::install-claude-tools.sh --check exited non-zero (non-fatal)" }
          }

      - name: Run setup unit tests (required, fail-closed)
        # setup/verify-windows.ps1 validates a fully-installed real machine
        # (live CLI binaries, dotfiles, bridge symlinks). A bare CI runner never
        # has that, so running it here previously needed `|| true` (which is not
        # even valid pwsh 7 syntax for this pattern) and hid real bugs (P0-4:
        # CI suppressed verifier failures). install-windows.ps1 above already
        # exercises the manifest/skill/adapter logic and fails closed with no
        # suppression. This step adds the other required, fail-closed gate: the
        # generate-mcp-config.py unit tests (PyYAML-required parsing,
        # config preservation, idempotency), which run the same on Windows.
        run: python -m unittest discover -s setup/tests -v

      - name: Summary
        if: always()
        run: |
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "## Windows Test Summary"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "- Install dry-run: ✅ (required)"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "- ECC --check: ⚠️ (skipped if vendor/ecc/ missing)"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "- claude.tools --check: ⚠️ (non-fatal; always runs against ai-config/skills/)"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "- setup unit tests: ✅ (required)"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "- Note: setup/verify-windows.ps1 validates a live installed machine and is not run against the bare CI runner; run it locally after setup/install-windows.ps1."
