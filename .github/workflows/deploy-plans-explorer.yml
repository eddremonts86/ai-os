# -----------------------------------------------------------------------------
# Deploy plans-explorer to Coolify.
#
# Mirrors .github/workflows/deploy-site.yml: pokes the Coolify API on push
# to main (when plans-explorer or this workflow changed), which triggers a
# git clone + build inside the VPS. Coolify proxies the resulting static
# bundle through Traefik at the configured fqdn.
#
# SAFE BY DEFAULT: until the 4 secrets below are set, this runs a green
# no-op (the same pattern as deploy-site.yml).
#
# Activation (values live in dev-env/env-config/.env — see setup/deploy/README.md):
#   gh secret set COOLIFY_API_URL
#   gh secret set COOLIFY_API_TOKEN
#   gh secret set COOLIFY_APP_UUID_PLANS_EXPLORER   # the plans-explorer app uuid
#   gh secret set SITE_URL_PLANS_EXPLORER         # e.g. https://plans-explorer.eduardoinerarte.dk
# -----------------------------------------------------------------------------
name: Deploy plans-explorer

on:
  push:
    branches: [main]
    paths:
      - "apps/plans-explorer/**"
      # The corpus is an input to the image, not just app source: the indexer reads
      # apps/data/projects/ at build time and plans.json is generated, never committed. Without
      # this path the daily pipeline would land new plans on main and change nothing
      # the site serves — a green push with a stale explorer behind it.
      - "apps/data/projects/**"
      - "Dockerfile.plans-explorer"
      - ".dockerignore"
      - ".github/workflows/deploy-plans-explorer.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-plans-explorer
  cancel-in-progress: false

jobs:
  deploy:
    # All the Coolify talking lives in the reusable workflow so the three
    # deploys here cannot drift apart again. It waits for the deployment to
    # reach `finished`; these three used to stop at "queued" and report a green
    # tick over a failed build.
    uses: ./.github/workflows/reusable-coolify-deploy.yml
    with:
      app: plans-explorer
    secrets:
      coolify_api_url: ${{ secrets.COOLIFY_API_URL }}
      coolify_api_token: ${{ secrets.COOLIFY_API_TOKEN }}
      app_uuid: ${{ secrets.COOLIFY_APP_UUID_PLANS_EXPLORER }}

  verify:
    name: Verify plans-explorer
    needs: deploy
    # Only when something was actually deployed. An unconfigured deploy is a
    # green no-op and has nothing to probe.
    if: needs.deploy.outputs.deployed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Verify the explorer
        env:
          SITE_URL_PLANS_EXPLORER: ${{ secrets.SITE_URL_PLANS_EXPLORER }}
        run: |
          set -euo pipefail
          if [ -z "${SITE_URL_PLANS_EXPLORER:-}" ]; then
            echo "::notice::SITE_URL_PLANS_EXPLORER not set — skipping the HTTP check."
            exit 0
          fi
          # No sleep any more: `deploy` waited for Coolify to report `finished`,
          # so the container is up before this job starts. The retries stay for
          # the seconds Traefik needs to pick up the new one.
          echo "Probing ${SITE_URL_PLANS_EXPLORER} …"
          for i in 1 2 3 4 5; do
            code=$(curl -fsS -o /dev/null -w '%{http_code}' --max-time 15 "$SITE_URL_PLANS_EXPLORER" || true)
            echo "attempt ${i}: HTTP ${code}"
            [ "$code" = "200" ] && { echo "✓ Live."; exit 0; }
            sleep 10
          done
          echo "::error title=Not serving::plans-explorer deployed but is not answering 200. Check the Coolify dashboard."
          exit 1
