# -----------------------------------------------------------------------------
# Deploy plans-explorer to Coolify.
#
# Mirrors .github/workflows/deploy-site.yml: pokes the Coolify API on push
# to main (when plans-explorer or this workflow changed), which triggers a
# git clone + build inside the VPS. Coolify proxies the resulting static
# bundle through Traefik at the configured fqdn.
#
# SAFE BY DEFAULT: until the 4 secrets below are set, this runs a green
# no-op (the same pattern as deploy-site.yml).
#
# Activation (values live in dev-env/env-config/.env — see setup/deploy/README.md):
#   gh secret set COOLIFY_API_URL
#   gh secret set COOLIFY_API_TOKEN
#   gh secret set COOLIFY_APP_UUID_PLANS_EXPLORER   # the plans-explorer app uuid
#   gh secret set SITE_URL_PLANS_EXPLORER         # e.g. https://plans-explorer.eduardoinerarte.dk
# -----------------------------------------------------------------------------
name: Deploy plans-explorer

on:
  push:
    branches: [main]
    paths:
      - "plans-explorer/**"
      - ".github/workflows/deploy-plans-explorer.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-plans-explorer
  cancel-in-progress: false

jobs:
  deploy:
    name: Trigger Coolify deployment (plans-explorer)
    runs-on: ubuntu-latest
    steps:
      - name: Guard — is deploy configured?
        id: guard
        env:
          COOLIFY_APP_UUID_PLANS_EXPLORER: ${{ secrets.COOLIFY_APP_UUID_PLANS_EXPLORER }}
        run: |
          if [ -z "$COOLIFY_APP_UUID_PLANS_EXPLORER" ]; then
            echo "::notice title=Deploy skipped::COOLIFY_APP_UUID_PLANS_EXPLORER secret is not set — pipeline wired but not activated. See setup/deploy/README.md."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger Coolify deploy
        if: steps.guard.outputs.configured == 'true'
        env:
          COOLIFY_API_URL: ${{ secrets.COOLIFY_API_URL }}
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
          COOLIFY_APP_UUID_PLANS_EXPLORER: ${{ secrets.COOLIFY_APP_UUID_PLANS_EXPLORER }}
        run: |
          set -euo pipefail
          echo "Requesting deployment of ${COOLIFY_APP_UUID_PLANS_EXPLORER} …"
          code=$(curl -sS -o /tmp/deploy.json -w '%{http_code}' --max-time 30 \
            -H "Authorization: Bearer ${COOLIFY_API_TOKEN}" \
            "${COOLIFY_API_URL%/}/api/v1/deploy?uuid=${COOLIFY_APP_UUID_PLANS_EXPLORER}&force=false")
          echo "Coolify responded HTTP ${code}:"
          cat /tmp/deploy.json; echo
          case "$code" in
            2*) echo "✓ Deployment queued." ;;
            *)  echo "::error title=Deploy trigger failed::Coolify returned HTTP ${code}"; exit 1 ;;
          esac

      - name: Verify (curl, best-effort)
        if: steps.guard.outputs.configured == 'true'
        env:
          SITE_URL_PLANS_EXPLORER: ${{ secrets.SITE_URL_PLANS_EXPLORER }}
        run: |
          set -euo pipefail
          if [ -z "${SITE_URL_PLANS_EXPLORER:-}" ]; then
            echo "::notice::SITE_URL_PLANS_EXPLORER not set — skipping HTTP check (Coolify builds asynchronously)."
            exit 0
          fi
          echo "Waiting ~40s for the Coolify build to roll out, then probing ${SITE_URL_PLANS_EXPLORER} …"
          sleep 40
          for i in 1 2 3 4 5; do
            code=$(curl -fsS -o /dev/null -w '%{http_code}' --max-time 15 "$SITE_URL_PLANS_EXPLORER" || true)
            echo "attempt ${i}: HTTP ${code}"
            [ "$code" = "200" ] && { echo "✓ Live."; exit 0; }
            sleep 15
          done
          echo "::warning::Site not 200 yet — the Coolify build may still be running. Check the Coolify dashboard."