# -----------------------------------------------------------------------------
# Deploy submission-api to Coolify.
#
# Mirrors deploy-site.yml and deploy-plans-explorer.yml: pokes the Coolify API on
# push to main when the service, its Dockerfile or the contract it validates
# against changed.
#
# SAFE BY DEFAULT: until the secrets below are set, this runs a green no-op.
# A successful run is therefore not evidence of a deploy — read the annotation.
#
# Activation:
#   gh secret set COOLIFY_API_URL
#   gh secret set COOLIFY_API_TOKEN
#   gh secret set COOLIFY_APP_UUID_SUBMISSION_API
#   gh secret set SITE_URL_SUBMISSION_API      # optional, for the health probe
#
# The Coolify app itself must exist first, with:
#   build_pack=dockerfile · dockerfile_location=/Dockerfile.submission-api
#   base_directory=/      · ports_exposes=8080
#
# And its environment must carry ALL FOUR of these or the service refuses every
# submission by design (see the fail-closed rule in apps/submission-api/server.mjs):
#   GITHUB_TOKEN     fine-grained, issues:write, ONE repository
#   GITHUB_REPO      owner/name
#   ALLOWED_ORIGIN   https://plans.eduardoinerarte.dk
#   TRUST_PROXY      1   (it sits behind Traefik; without this the rate limit
#                        counts every request as coming from the proxy)
# -----------------------------------------------------------------------------
name: Deploy submission-api

on:
  push:
    branches: [main]
    paths:
      - "apps/submission-api/**"
      # The service validates against the plan contract and reads it at startup, so a
      # schema change alters what it accepts even when its own code is untouched.
      - "apps/data/projects/_schema.json"
      - "Dockerfile.submission-api"
      - ".dockerignore"
      - ".github/workflows/deploy-submission-api.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-submission-api
  cancel-in-progress: false

jobs:
  deploy:
    # All the Coolify talking lives in the reusable workflow so the three
    # deploys here cannot drift apart again. It waits for the deployment to
    # reach `finished`; these three used to stop at "queued" and report a green
    # tick over a failed build.
    uses: ./.github/workflows/reusable-coolify-deploy.yml
    with:
      app: submission-api
    secrets:
      coolify_api_url: ${{ secrets.COOLIFY_API_URL }}
      coolify_api_token: ${{ secrets.COOLIFY_API_TOKEN }}
      app_uuid: ${{ secrets.COOLIFY_APP_UUID_SUBMISSION_API }}

  verify:
    name: Verify submission-api
    needs: deploy
    # Only when something was actually deployed. An unconfigured deploy is a
    # green no-op and has nothing to probe.
    if: needs.deploy.outputs.deployed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Verify by content, not by status code
        env:
          SITE_URL_SUBMISSION_API: ${{ secrets.SITE_URL_SUBMISSION_API }}
        run: |
          set -euo pipefail
          if [ -z "${SITE_URL_SUBMISSION_API:-}" ]; then
            echo "::notice::SITE_URL_SUBMISSION_API not set — skipping the health probe."
            exit 0
          fi
          # No sleep any more: `deploy` waited for Coolify to report `finished`.
          echo "Probing ${SITE_URL_SUBMISSION_API}/health …"
          for i in 1 2 3 4 5; do
            body=$(curl -fsS --max-time 15 "${SITE_URL_SUBMISSION_API%/}/health" || true)
            echo "attempt ${i}: ${body:-(no response)}"
            # `configured` is the whole point: a 200 with configured:false means the container is
            # up and will refuse every submission, which is a failed deploy wearing a green tick.
            case "$body" in
              *'"configured":true'*) echo "✓ Live and configured."; exit 0 ;;
              *'"configured":false'*)
                echo "::error title=Deployed but not configured::/health reports configured:false. Check GITHUB_TOKEN, GITHUB_REPO and ALLOWED_ORIGIN in the Coolify environment — all three are required."
                exit 1 ;;
            esac
            sleep 10
          done
          echo "::error title=No health response::The submission API deployed but /health never answered."
          exit 1
