# -----------------------------------------------------------------------------
# Deploy the AI-OS landing (site/) to a Hetzner VPS over SSH/rsync.
#
# SAFE BY DEFAULT: until the 6 secrets below are set, this workflow runs a
# green no-op (the guard step skips everything). It never breaks CI and never
# sends failure noise. Setting the secrets "switches it on".
#
# One-time activation (see setup/deploy/README.md for full steps):
#   gh secret set HETZNER_HOST         # server IP or hostname
#   gh secret set HETZNER_USER         # ssh user (e.g. deploy)
#   gh secret set HETZNER_SSH_KEY      # private key (multiline) for that user
#   gh secret set HETZNER_KNOWN_HOSTS  # output of: ssh-keyscan <host>
#   gh secret set HETZNER_DEPLOY_PATH  # dedicated dir, e.g. /var/www/ai-os
#   gh secret set SITE_URL             # https URL to verify, e.g. https://ai-os.example.com
# -----------------------------------------------------------------------------
name: Deploy site

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/deploy-site.yml"
      - ".github/nginx/ai-os.conf.example"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-site
  cancel-in-progress: true

jobs:
  deploy:
    name: rsync site/ to Hetzner
    runs-on: ubuntu-latest
    steps:
      - name: Guard — is deploy configured?
        id: guard
        env:
          HETZNER_HOST: ${{ secrets.HETZNER_HOST }}
        run: |
          if [ -z "$HETZNER_HOST" ]; then
            echo "::notice title=Deploy skipped::HETZNER_HOST secret is not set — deploy pipeline is wired but not activated yet. See setup/deploy/README.md."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.guard.outputs.configured == 'true'
        uses: actions/checkout@v4

      - name: Configure SSH
        if: steps.guard.outputs.configured == 'true'
        env:
          SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.HETZNER_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Deploy (rsync)
        if: steps.guard.outputs.configured == 'true'
        env:
          DEPLOY_HOST: ${{ secrets.HETZNER_HOST }}
          DEPLOY_USER: ${{ secrets.HETZNER_USER }}
          DEPLOY_PATH: ${{ secrets.HETZNER_DEPLOY_PATH }}
        run: |
          set -euo pipefail
          echo "Dry run first (no changes applied):"
          rsync -az --delete --dry-run \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes -o BatchMode=yes" \
            site/ "${DEPLOY_USER}@${DEPLOY_HOST}:${DEPLOY_PATH}/"
          echo "Applying:"
          rsync -az --delete \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes -o BatchMode=yes" \
            site/ "${DEPLOY_USER}@${DEPLOY_HOST}:${DEPLOY_PATH}/"

      - name: Verify (curl)
        if: steps.guard.outputs.configured == 'true'
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
        run: |
          set -euo pipefail
          if [ -z "${SITE_URL:-}" ]; then
            echo "::warning::SITE_URL not set — skipping HTTP verification."
            exit 0
          fi
          code=$(curl -fsS -o /dev/null -w '%{http_code}' --max-time 20 "$SITE_URL" || true)
          echo "HTTP ${code} from ${SITE_URL}"
          if [ "$code" != "200" ]; then
            echo "::error title=Verification failed::expected HTTP 200, got ${code}"
            exit 1
          fi
          echo "✓ Live and serving 200."
