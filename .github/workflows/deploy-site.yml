# -----------------------------------------------------------------------------
# Deploy the AI-OS landing (apps/site/) by triggering a Coolify deployment.
#
# The landing runs as a Coolify application on a Hetzner VPS, built from the
# repo-root Dockerfile (nginx serving apps/site/) and routed by Traefik at
# https://ai-os.eduardoinerarte.dk. Coolify clones the repo with its stored
# deploy key/credentials, so this workflow only needs to POKE Coolify to pull
# + rebuild on each push.
#
# SAFE BY DEFAULT: until the 3 secrets below are set, this runs a green no-op.
#
# Activation (values live in dev-env/env-config/.env — see setup/deploy/README.md):
#   gh secret set COOLIFY_API_URL     # e.g. http://<your-coolify-host>:8000
#   gh secret set COOLIFY_API_TOKEN   # Coolify API token (Bearer)
#   gh secret set COOLIFY_APP_UUID    # the ai-os-landing app uuid
#   gh secret set SITE_URL            # optional, e.g. https://ai-os.eduardoinerarte.dk
# -----------------------------------------------------------------------------
name: Deploy site

on:
  push:
    branches: [main]
    paths:
      - "apps/site/**"
      - "Dockerfile"
      - ".github/workflows/deploy-site.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-site
  cancel-in-progress: false

jobs:
  deploy:
    # All the Coolify talking lives in the reusable workflow so the three
    # deploys here cannot drift apart again. It waits for the deployment to
    # reach `finished`; these three used to stop at "queued" and report a green
    # tick over a failed build.
    uses: ./.github/workflows/reusable-coolify-deploy.yml
    with:
      app: site
    secrets:
      coolify_api_url: ${{ secrets.COOLIFY_API_URL }}
      coolify_api_token: ${{ secrets.COOLIFY_API_TOKEN }}
      app_uuid: ${{ secrets.COOLIFY_APP_UUID }}

  verify:
    name: Verify site
    needs: deploy
    # Only when something was actually deployed. An unconfigured deploy is a
    # green no-op and has nothing to probe.
    if: needs.deploy.outputs.deployed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Verify the landing
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
        run: |
          set -euo pipefail
          if [ -z "${SITE_URL:-}" ]; then
            echo "::notice::SITE_URL not set — skipping the HTTP check."
            exit 0
          fi
          # No sleep any more: `deploy` waited for Coolify to report `finished`,
          # so the container is up before this job starts. The retries stay for
          # the seconds Traefik needs to pick up the new one.
          echo "Probing ${SITE_URL} …"
          for i in 1 2 3 4 5; do
            code=$(curl -fsS -o /dev/null -w '%{http_code}' --max-time 15 "$SITE_URL" || true)
            echo "attempt ${i}: HTTP ${code}"
            [ "$code" = "200" ] && { echo "✓ Live."; exit 0; }
            sleep 10
          done
          echo "::error title=Not serving::The landing deployed but is not answering 200. Check the Coolify dashboard."
          exit 1
