# -----------------------------------------------------------------------------
# Deploy the AI-OS landing (site/) by triggering a Coolify deployment.
#
# The landing runs as a Coolify application on a Hetzner VPS, built from the
# repo-root Dockerfile (nginx serving site/) and routed by Traefik at
# https://ai-os.eduardoinerarte.dk. Coolify clones the repo with its stored
# deploy key/credentials, so this workflow only needs to POKE Coolify to pull
# + rebuild on each push.
#
# SAFE BY DEFAULT: until the 3 secrets below are set, this runs a green no-op.
#
# Activation (values live in dev-env/env-config/.env — see setup/deploy/README.md):
#   gh secret set COOLIFY_API_URL     # e.g. http://<your-coolify-host>:8000
#   gh secret set COOLIFY_API_TOKEN   # Coolify API token (Bearer)
#   gh secret set COOLIFY_APP_UUID    # the ai-os-landing app uuid
#   gh secret set SITE_URL            # optional, e.g. https://ai-os.eduardoinerarte.dk
# -----------------------------------------------------------------------------
name: Deploy site

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "Dockerfile"
      - ".github/workflows/deploy-site.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-site
  cancel-in-progress: false

jobs:
  deploy:
    name: Trigger Coolify deployment
    runs-on: ubuntu-latest
    steps:
      - name: Guard — is deploy configured?
        id: guard
        env:
          COOLIFY_APP_UUID: ${{ secrets.COOLIFY_APP_UUID }}
        run: |
          if [ -z "$COOLIFY_APP_UUID" ]; then
            echo "::notice title=Deploy skipped::COOLIFY_APP_UUID secret is not set — pipeline wired but not activated. See setup/deploy/README.md."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger Coolify deploy
        if: steps.guard.outputs.configured == 'true'
        env:
          COOLIFY_API_URL: ${{ secrets.COOLIFY_API_URL }}
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
          COOLIFY_APP_UUID: ${{ secrets.COOLIFY_APP_UUID }}
        run: |
          set -euo pipefail
          echo "Requesting deployment of ${COOLIFY_APP_UUID} …"
          code=$(curl -sS -o /tmp/deploy.json -w '%{http_code}' --max-time 30 \
            -H "Authorization: Bearer ${COOLIFY_API_TOKEN}" \
            "${COOLIFY_API_URL%/}/api/v1/deploy?uuid=${COOLIFY_APP_UUID}&force=false")
          echo "Coolify responded HTTP ${code}:"
          cat /tmp/deploy.json; echo
          case "$code" in
            2*) echo "✓ Deployment queued." ;;
            *)  echo "::error title=Deploy trigger failed::Coolify returned HTTP ${code}"; exit 1 ;;
          esac

      - name: Verify (curl, best-effort)
        if: steps.guard.outputs.configured == 'true'
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
        run: |
          set -euo pipefail
          if [ -z "${SITE_URL:-}" ]; then
            echo "::notice::SITE_URL not set — skipping HTTP check (Coolify builds asynchronously)."
            exit 0
          fi
          echo "Waiting ~40s for the Coolify build to roll out, then probing ${SITE_URL} …"
          sleep 40
          for i in 1 2 3 4 5; do
            code=$(curl -fsS -o /dev/null -w '%{http_code}' --max-time 15 "$SITE_URL" || true)
            echo "attempt ${i}: HTTP ${code}"
            [ "$code" = "200" ] && { echo "✓ Live."; exit 0; }
            sleep 15
          done
          echo "::warning::Site not 200 yet — the Coolify build may still be running. Check the Coolify dashboard."
