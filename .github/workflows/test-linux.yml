name: Test Linux

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install yq
        # Use mikefarah/yq v4 (not snap version which is incompatible)
        run: |
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq
          yq --version

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Run install-mac.sh (DRY_RUN on Linux)
        env:
          DRY_RUN: '1'
          # On Linux, $HOME is /home/runner
        run: bash setup/install-mac.sh

      - name: Verify ECC integration (--check)
        # Non-fatal: ECC may not be vendored on every PR. We log a warning instead
        # of failing the build so that PRs touching unrelated files stay green.
        run: |
          if [ -d vendor/ecc ]; then
            echo "vendor/ecc/ present, running install-ecc.sh --check..."
            bash setup/install-ecc.sh --check
          else
            echo "::warning::vendor/ecc/ not present; skipping ECC --check (this is OK if the PR doesn't touch ECC integration)."
          fi

      - name: Run verify.sh (DRY_RUN on Linux)
        env:
          DRY_RUN: '1'
        run: |
          bash setup/verify.sh || true

      - name: Summary
        if: always()
        run: |
          echo "## Linux Test Summary" >> $GITHUB_STEP_SUMMARY
          echo "- Install dry-run: ✅" >> $GITHUB_STEP_SUMMARY
          echo "- ECC --check: ⚠️ (skipped if vendor/ecc/ missing)" >> $GITHUB_STEP_SUMMARY
          echo "- Verify: ⚠️ (Linux-specific paths expected to differ)" >> $GITHUB_STEP_SUMMARY
