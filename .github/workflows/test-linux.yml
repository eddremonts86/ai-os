name: Test Linux

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install yq
        # Usar mikefarah/yq v4 (no snap version que es incompatible)
        run: |
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq
          yq --version

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Run install-mac.sh (DRY_RUN en Linux)
        env:
          DRY_RUN: '1'
          # En Linux, $HOME es /home/runner
        run: bash setup/install-mac.sh

      - name: Run verify.sh (DRY_RUN en Linux)
        env:
          DRY_RUN: '1'
        run: |
          bash setup/verify.sh || true

      - name: Summary
        if: always()
        run: |
          echo "## Linux Test Summary" >> $GITHUB_STEP_SUMMARY
          echo "- Install dry-run: ✅" >> $GITHUB_STEP_SUMMARY
          echo "- Verify: ⚠️ (Linux-specific paths expected to differ)" >> $GITHUB_STEP_SUMMARY
