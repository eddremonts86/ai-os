# -----------------------------------------------------------------------------
# Test macOS — thin wrapper around .github/workflows/reusable-test.yml.
# All steps live in the reusable workflow so macOS + Linux stay in sync.
# -----------------------------------------------------------------------------
name: Test macOS

on:
  pull_request:
    # dev too: the plans pipeline promotes through dev, and it refuses to merge
    # unless checks are green. With main-only triggers the dev hop saw no test
    # run at all, so that guard was satisfied by a check that proved nothing.
    branches: [main, dev]
  push:
    branches: [main]
  # On demand. Direct pushes to dev trigger nothing — only PRs and pushes to main do — so 15
  # commits can land on dev with no CI signal at all, which is exactly what happened. This makes
  # the Linux and Windows checks runnable without opening a PR first.
  workflow_dispatch:

jobs:
  test:
    uses: ./.github/workflows/reusable-test.yml
    with:
      os: macos
      install_node: "true"
      node_version: "22"