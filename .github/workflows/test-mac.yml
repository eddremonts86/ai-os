name: Test macOS

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    runs-on: macos-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install yq
        run: brew install yq

      - name: Install PyYAML
        run: pip3 install pyyaml

      - name: Run install-mac.sh (DRY_RUN)
        env:
          DRY_RUN: '1'
        run: bash setup/install-mac.sh

      - name: Verify ECC integration (--check)
        # Non-fatal: ECC may not be vendored on every PR. We log a warning instead
        # of failing the build so that PRs touching unrelated files stay green.
        run: |
          if [ -d vendor/ecc ]; then
            echo "vendor/ecc/ present, running install-ecc.sh --check..."
            bash setup/install-ecc.sh --check
          else
            echo "::warning::vendor/ecc/ not present; skipping ECC --check (this is OK if the PR doesn't touch ECC integration)."
          fi

      - name: Run verify.sh (DRY_RUN)
        env:
          DRY_RUN: '1'
        run: |
          # verify.sh also works in dry-run mode (does not require a real system)
          # But some checks will fail (Warp, brew packages, etc.) — these are expected
          bash setup/verify.sh || true

      - name: Summary
        if: always()
        run: |
          echo "## macOS Test Summary" >> $GITHUB_STEP_SUMMARY
          echo "- Install dry-run: ✅" >> $GITHUB_STEP_SUMMARY
          echo "- ECC --check: ⚠️ (skipped if vendor/ecc/ missing)" >> $GITHUB_STEP_SUMMARY
          echo "- Verify: ⚠️ (some checks expected to fail in CI)" >> $GITHUB_STEP_SUMMARY
