# -----------------------------------------------------------------------------
# Trigger a Coolify deployment and WAIT to hear whether it worked.
#
# The three deploy workflows here were the same forty lines three times over,
# and all three stopped at "queued". Coolify answers as soon as the build enters
# its queue, not when it is live, so a failed build reported a green tick and
# the only place the truth existed was a log on the server. That is the same
# failure this pipeline exists to prevent, wearing the pipeline's own colours.
#
# Callers keep their own verification, because it differs: the site probes for
# a 200, the submission API probes for `configured:true` — a 200 from a
# container that will refuse every submission is a failed deploy in disguise.
# What they no longer do is sleep 40 seconds and hope; by the time a caller's
# verify job starts, this workflow has seen the deployment reach `finished`.
#
# API shape, all of it checked against the running Coolify rather than recalled:
#   trigger  GET /api/v1/deploy?uuid=…&force=false      (route:list --path=api/v1)
#   returns  {"deployments":[{message, resource_uuid, deployment_uuid?}]}
#            — deployment_uuid is OPTIONAL; DeployController omits it when
#              nothing was queued
#   poll     GET /api/v1/deployments/<deployment_uuid>
#   states   queued | in_progress | finished | failed | cancelled-by-user
#            — note the hyphen, and note that `success` and `error` are not
#              among them
# -----------------------------------------------------------------------------
name: Coolify deploy (reusable)

on:
  workflow_call:
    inputs:
      app:
        description: 'Human name of the app, for log lines.'
        required: true
        type: string
      require_secrets:
        description: >
          Fail when the deploy is not configured, instead of the green no-op.
          Two honest conventions, and which one is right depends on the repo:
          a deploy that is wired but deliberately not activated should not fail
          every push, while a repo whose deploy is supposed to work needs to
          hear about a missing secret rather than collect green ticks that
          deployed nothing.
        required: false
        default: false
        type: boolean
      wait_minutes:
        description: >
          How long to wait for the deployment to reach `finished`. This was 10,
          hardcoded, and edd-remonts-dashboard overran it on three consecutive
          deploys that all went on to succeed — so the pipeline reported red
          over a live site, which is the same lie as green over a dead one.
          Raise it for an app whose image takes longer to build than the box
          takes to serve it. Waiting longer costs nothing on a fast deploy: the
          loop exits the moment Coolify says `finished`. The ceiling is 40; the
          job timeout below is derived from this value, not repeated.
        required: false
        default: 20
        type: number
    secrets:
      coolify_api_url:
        required: false
      coolify_api_token:
        required: false
      app_uuid:
        required: false
    outputs:
      deployed:
        description: 'true when a deployment finished; false when the deploy is not configured yet.'
        value: ${{ jobs.deploy.outputs.deployed }}

jobs:
  deploy:
    name: Deploy ${{ inputs.app }}
    runs-on: ubuntu-latest
    # Derived, never typed twice. A job timeout below the wait is a second,
    # invisible ceiling: GitHub kills the runner and every honest message this
    # workflow was about to print — the timeout notice, the Coolify link — dies
    # with it, leaving a bare "cancelled" to debug. The five minutes are for
    # the trigger request and the last poll in flight.
    timeout-minutes: ${{ inputs.wait_minutes + 5 }}
    outputs:
      deployed: ${{ steps.run.outputs.deployed }}

    steps:
      # Two conventions, both honest, chosen by the caller. Safe-by-default is
      # about ACTIVATION: a deploy that is wired but not switched on should not
      # fail every push. `require_secrets: true` is for a repo whose deploy is
      # meant to work, where a missing secret must be heard rather than
      # collected as another green tick that deployed nothing.
      #
      # Neither is permission to report success once the deploy is real. That
      # is what the wait below is for.
      - name: Guard — is deploy configured?
        id: guard
        env:
          APP_UUID: ${{ secrets.app_uuid }}
          REQUIRE: ${{ inputs.require_secrets }}
        run: |
          if [ -n "$APP_UUID" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          elif [ "$REQUIRE" = "true" ]; then
            echo "::error title=Deploy not configured::No app uuid secret for ${{ inputs.app }}. This repo asked to be told rather than skipped."
            exit 1
          else
            echo "::notice title=Deploy skipped::No app uuid secret for ${{ inputs.app }} — pipeline wired but not activated. See setup/deploy/README.md."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy, and wait for the result
        id: run
        if: steps.guard.outputs.configured == 'true'
        env:
          COOLIFY_API_URL: ${{ secrets.coolify_api_url }}
          COOLIFY_API_TOKEN: ${{ secrets.coolify_api_token }}
          APP_UUID: ${{ secrets.app_uuid }}
          APP: ${{ inputs.app }}
          WAIT_MINUTES: ${{ inputs.wait_minutes }}
        run: |
          set -euo pipefail
          base="${COOLIFY_API_URL%/}"
          auth="Authorization: Bearer $COOLIFY_API_TOKEN"

          # Checked before anything is triggered. Past the ceiling GitHub's own
          # `timeout-minutes` wins and cuts the runner mid-poll, so the
          # messages below never print — and refusing after the trigger would
          # start a deployment this job then declines to watch.
          if [ "$WAIT_MINUTES" -lt 1 ] || [ "$WAIT_MINUTES" -gt 40 ]; then
            echo "::error title=Bad wait_minutes::wait_minutes must be between 1 and 40, got $WAIT_MINUTES. Nothing was deployed."
            exit 1
          fi

          echo "Requesting deployment of $APP …"
          code=$(curl -sS -o /tmp/deploy.json -w '%{http_code}' --max-time 60 \
            -H "$auth" -H 'Accept: application/json' \
            "$base/api/v1/deploy?uuid=$APP_UUID&force=false")
          echo "Coolify responded HTTP $code:"
          cat /tmp/deploy.json; echo

          if [ "$code" = "429" ]; then
            echo "::error title=Rate limited::Coolify is throttling deploys — re-run this workflow in a minute."
            exit 1
          fi
          case "$code" in
            2*) ;;
            *) echo "::error title=Deploy trigger failed::Coolify returned HTTP $code"; exit 1 ;;
          esac

          id=$(jq -r '.deployments[0].deployment_uuid // empty' /tmp/deploy.json)
          if [ -z "$id" ]; then
            echo "::error title=Nothing queued::Coolify accepted the request but queued no deployment — its message above says why."
            exit 1
          fi

          # A deadline off the clock, not a count of iterations. Sixty polls of
          # `sleep 10` was described everywhere as ten minutes and was never
          # ten minutes: each turn also spends up to thirty seconds inside
          # curl, so the real window drifted with how slow Coolify felt that
          # afternoon. A deadline makes "within N minutes" literally true.
          deadline=$(( $(date +%s) + WAIT_MINUTES * 60 ))
          poll=0
          unreachable=0

          echo "Waiting on deployment $id — up to $WAIT_MINUTES minutes …"
          while :; do
            poll=$(( poll + 1 ))

            # Asked before sleeping: a deployment that finished while this job
            # was starting up should not cost ten seconds to notice.
            if status=$(curl -fsS -H "$auth" --max-time 30 \
              "$base/api/v1/deployments/$id" | jq -r '.status // "?"'); then
              unreachable=0
            else
              # A blip in Coolify's API is not a failed deployment — the build
              # is still running on the box either way. The previous version
              # exited here, turning somebody else's five-second outage into a
              # red tick over a live site.
              unreachable=$(( unreachable + 1 ))
              status="unreachable"
            fi

            echo "  poll $poll: $status"

            case "$status" in
              finished)
                echo "✓ $APP is live."
                echo "deployed=true" >> "$GITHUB_OUTPUT"
                exit 0 ;;
              failed|cancelled-by-user)
                echo "::error title=Deployment $status::See the Coolify deployment log for $APP."
                exit 1 ;;
            esac

            # Tolerated, not ignored: a minute of consecutive failures means
            # the API is gone, and continuing to poll it is theatre.
            if [ "$unreachable" -ge 6 ]; then
              echo "::error title=Coolify unreachable::Six consecutive polls failed. The deployment of $APP may still be running — check its log in Coolify."
              exit 1
            fi

            [ "$(date +%s)" -lt "$deadline" ] || break
            sleep 10
          done

          # Deliberately not phrased as a failed deploy, because it is not one.
          # This is the workflow saying it stopped waiting: a slow build keeps
          # going after the runner leaves, and three of these were later found
          # live in production.
          echo "::error title=Stopped waiting::$APP did not reach \`finished\` in the $WAIT_MINUTES min this job waited. The build may still be running — check Coolify, and raise wait_minutes if this app is simply slower than its wait."
          exit 1
