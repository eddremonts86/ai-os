name: rea
description: REA (github.com/morluto/rea, MIT) - reverse-engineer shipped artifacts (binaries, Electron/JS, .NET, APK, websites, HAR captures) and return the evidence behind each conclusion. Optional, off by default.
transport: stdio
command: npx
args:
  - -y
  - rea-agents@6.9.0
  - mcp
env:
  # compact tool schemas: the full tool set, far fewer tokens per session
  REA_MCP_INPUT_SCHEMA_PROFILE: compact
# Off by default: ~190 MB package, needs Node >=22.23, and native analysis also needs Hopper, Ghidra or IDA.
# To opt in: set `enabled: true`, then `python3 setup/sync-ide-mcp-servers.py` (and the Hermes generator).
# While it is false the sync removes any server named `rea` from every client, so do not run `npx rea-agents setup`:
# it edits client configs this repo generates.
# Only for software you own or are authorized to examine (REA's DISCLAIMER.md rules out DRM/licence circumvention,
# cheats and copying proprietary code). The security audit uses its CLI without this MCP: aios-security-audit step 2b.
enabled: false
