name: graphiti
description: >-
  Temporal knowledge-graph memory (getzep/graphiti) served over HTTP by the
  ia-os-graphiti-mcp container, backed by ia-os-falkordb. Both are defined in
  memory/docker-compose.yml and started by `ai-os memory start`.
  Entity extraction uses the host's native Ollama (gemma via
  GRAPHITI_LLM_MODEL), embeddings use nomic-embed-text on the same Ollama, so
  it needs no API key. Verified end-to-end 2026-11-05 (add_memory →
  search_memory_facts). Usage rules: rules/always_do.md "Use the memory
  stack". Health: `ai-os memory status` or setup/verify.sh section 5b.
transport: http
url: http://127.0.0.1:8021/mcp/
enabled: true
