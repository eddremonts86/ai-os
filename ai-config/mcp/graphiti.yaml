name: graphiti
description: >-
  Disabled until a pinned Graphiti MCP deployment has an executable smoke test.
  Verified against the official docs (2026-07-12,
  https://github.com/getzep/graphiti/blob/main/mcp_server/README.md): there is
  NO installable `graphiti_mcp_server` module inside the `graphiti-core` PyPI
  package, so `uv run --with graphiti-core[falkordb] python -m
  graphiti_mcp_server` (the previous value here) would fail even if enabled.
  The real MCP server is a standalone app (`main.py`) that only exists inside
  a checkout of https://github.com/getzep/graphiti (`mcp_server/` subdir), run
  via `uv run main.py` from that directory, or via the pre-built
  `zepai/knowledge-graph-mcp` Docker image over HTTP transport (not stdio).
  Either path needs a real decision (vendor the repo under vendor/graphiti/ vs.
  run the Docker image against our existing FalkorDB on :6390) plus HTTP
  transport support in setup/generate-mcp-config.py, which does not exist yet.
  Do not re-enable this without both of those and a real smoke test.
transport: stdio
command: uv
args:
  - run
  - --directory
  - "${AI_OS_ROOT}/vendor/graphiti/mcp_server"  # NOT YET VENDORED — placeholder path
  - main.py
  - --transport
  - stdio
  - --database-provider
  - falkordb
env:
  FALKORDB_URI: redis://localhost:6390
  GRAPHITI_TELEMETRY_ENABLED: "false"
  OPENAI_API_KEY: ${OPENAI_API_KEY}
  # To swap to local Ollama: set GRAPHITI_LLM_PROVIDER=ollama
  # GRAPHITI_LLM_PROVIDER: ollama
  # GRAPHITI_LLM_MODEL: qwen2.5-coder:7b
  # OLLAMA_URL: http://localhost:11500
enabled: false

