version: 1

# This file is the single source of truth for adapter destinations and setup
# verification severity. Paths are relative to the target user's home directory.
components:
  skill_source:
    required: true
    path: ai-config/skills
  native_adapters:
    required: true
    template: ai-config/templates/global-bridge.md.tmpl
  optional_integrations:
    required: false
    names:
      - hermes_soul
      - minimax_overlay
      - vscode_copilot_chat
  ponytail:
    required: false
    version: 4.9.0
    description: "lazy senior dev ruleset — portable plugin/rules (DietrichGebert/ponytail, MIT)"
    default_mode: full
    config_path: .config/ponytail/config.json
    source: "https://github.com/DietrichGebert/ponytail"
  intent_home:
    required: false
    path: intent
    template: intent/intent-template.md
    skill: ai-config/skills/intent-to-spec

platforms:
  macos:
    skills:
      clients:
        - { id: claude, path: .claude/skills, required: true }
        - { id: codex, path: .codex/skills, required: true }
        - { id: gemini, path: .gemini/skills, required: true }
        - { id: antigravity, path: .agents/skills, required: true }
        - { id: minimax, path: .minimax/skills, required: false }
        # Antigravity's real GLOBAL (all-workspaces) skill path per its own docs
        # (https://antigravity.google/docs/skills, confirmed 2026-07-12): the
        # table there lists `~/.gemini/config/skills/` as global and
        # `<workspace-root>/.agents/skills/` as workspace-scoped. `.agents/skills`
        # above is still deployed too (many other consumers — Hermes
        # external_dirs, VS Code Copilot Chat, this very install's own docs
        # convention — already treat it as a shared global location), so this
        # is additive, not a replacement. Marked optional since it has not been
        # field-verified against a real Antigravity install (no binary
        # available in this dev environment).
        - { id: antigravity-global, path: .gemini/config/skills, required: false }
      # Hermes natively supports `skills.external_dirs` in config.yaml (confirmed
      # against https://hermes-agent.nousresearch.com/docs/user-guide/features/skills
      # on 2026-07-12, whose own example uses this exact path). It scans the
      # directory directly — no per-skill symlinking needed, unlike the other
      # clients above. This replaces the old `.hermes/skills/imported` symlink
      # tree (P1-2: "duplicating all skills under imported/").
      external_dirs:
        - { id: hermes, path: .agents/skills }
    adapters:
      - { id: claude, path: .claude/CLAUDE.md, required: true }
      - { id: codex, path: .codex/AGENTS.md, required: true }
      - { id: gemini, path: .gemini/GEMINI.md, required: true }
      - { id: antigravity, path: .agents/AGENTS.md, required: true }
  windows:
    skills:
      clients:
        - { id: claude, path: .claude/skills, required: true }
        - { id: codex, path: .codex/skills, required: true }
        - { id: gemini, path: .gemini/skills, required: true }
        - { id: antigravity, path: .agents/skills, required: true }
        - { id: antigravity-global, path: .gemini/config/skills, required: false }
      external_dirs:
        - { id: hermes, path: .agents/skills }
    adapters:
      - { id: claude, path: .claude/CLAUDE.md, required: true }
      - { id: codex, path: .codex/AGENTS.md, required: true }
      - { id: gemini, path: .gemini/GEMINI.md, required: true }
      - { id: antigravity, path: .agents/AGENTS.md, required: true }

required_skills:
  - brainstorming
  - dispatching-parallel-agents
  - executing-plans
  - finishing-a-development-branch
  - receiving-code-review
  - requesting-code-review
  - subagent-driven-development
  - systematic-debugging
  - test-driven-development
  - using-git-worktrees
  - using-superpowers
  - verification-before-completion
  - writing-plans
  - writing-skills
