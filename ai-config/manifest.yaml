version: 1

# This file is the single source of truth for adapter destinations and setup
# verification severity. Paths are relative to the target user's home directory.
components:
  skill_source:
    required: true
    path: ai-config/skills
  native_adapters:
    required: true
    template: ai-config/templates/global-bridge.md.tmpl
  optional_integrations:
    required: false
    names:
      - hermes_soul
      - minimax_overlay
      - vscode_copilot_chat

platforms:
  macos:
    skills:
      clients:
        - { id: claude, path: .claude/skills, required: true }
        - { id: codex, path: .codex/skills, required: true }
        - { id: gemini, path: .gemini/skills, required: true }
        - { id: antigravity, path: .agents/skills, required: true }
        - { id: minimax, path: .minimax/skills, required: false }
      # Hermes natively supports `skills.external_dirs` in config.yaml (confirmed
      # against https://hermes-agent.nousresearch.com/docs/user-guide/features/skills
      # on 2026-07-12, whose own example uses this exact path). It scans the
      # directory directly — no per-skill symlinking needed, unlike the other
      # clients above. This replaces the old `.hermes/skills/imported` symlink
      # tree (P1-2: "duplicating all skills under imported/").
      external_dirs:
        - { id: hermes, path: .agents/skills }
    adapters:
      - { id: claude, path: .claude/CLAUDE.md, required: true }
      - { id: codex, path: .codex/AGENTS.md, required: true }
      - { id: gemini, path: .gemini/GEMINI.md, required: true }
      - { id: antigravity, path: .agents/AGENTS.md, required: true }
  windows:
    skills:
      clients:
        - { id: claude, path: .claude/skills, required: true }
        - { id: codex, path: .codex/skills, required: true }
        - { id: gemini, path: .gemini/skills, required: true }
        - { id: antigravity, path: .agents/skills, required: true }
      external_dirs:
        - { id: hermes, path: .agents/skills }
    adapters:
      - { id: claude, path: .claude/CLAUDE.md, required: true }
      - { id: codex, path: .codex/AGENTS.md, required: true }
      - { id: gemini, path: .gemini/GEMINI.md, required: true }
      - { id: antigravity, path: .agents/AGENTS.md, required: true }

required_skills:
  - brainstorming
  - dispatching-parallel-agents
  - executing-plans
  - finishing-a-development-branch
  - receiving-code-review
  - requesting-code-review
  - subagent-driven-development
  - systematic-debugging
  - test-driven-development
  - using-git-worktrees
  - using-superpowers
  - verification-before-completion
  - writing-plans
  - writing-skills
