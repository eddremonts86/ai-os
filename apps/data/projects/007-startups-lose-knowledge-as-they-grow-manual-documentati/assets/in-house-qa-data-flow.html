<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>007 · Data flow · In-house Q&A over Slack</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Space Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #08090e;
      --color-ink:     #f4f5f9;
      --color-muted:   #a2a4ae;
      --color-accent:  #b3ee55;
      --font-sans:     'Space Grotesk', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'JetBrains Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Data Flow · Diagram Design</p>
    <h1>In-house Q&amp;A · Slack ingest → retrieval → answer</h1>

    <svg viewBox="0 0 1000 540" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="df-007-title df-007-desc">
      <title id="df-007-title">In-house Q&amp;A · Slack ingest → retrieval → answer</title>
      <desc id="df-007-desc">Data-flow diagram showing two source streams (Slack channels and meeting transcripts) feeding an ingest worker that chunks and embeds into a per-tenant pgvector index, then a per-question retrieval that Claude synthesises into an answer with citations, gated by a per-chunk permission filter.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#a2a4ae"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#b3ee55"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#3bdfef"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#08090e"/>

      <!-- Phase banner -->
      <text x="120" y="32" fill="#a2a4ae" font-size="7" font-family="'JetBrains Mono', monospace" letter-spacing="0.14em" text-anchor="middle">SOURCES</text>
      <text x="380" y="32" fill="#a2a4ae" font-size="7" font-family="'JetBrains Mono', monospace" letter-spacing="0.14em" text-anchor="middle">INGEST</text>
      <text x="640" y="32" fill="#a2a4ae" font-size="7" font-family="'JetBrains Mono', monospace" letter-spacing="0.14em" text-anchor="middle">RETRIEVE</text>
      <text x="880" y="32" fill="#a2a4ae" font-size="7" font-family="'JetBrains Mono', monospace" letter-spacing="0.14em" text-anchor="middle">SYNTHESISE</text>

      <line x1="20" y1="44" x2="980" y2="44" stroke="rgba(244,245,249,0.10)" stroke-width="0.8"/>

      <!-- Arrows -->
      <path d="M 220,108 H 296" fill="none" stroke="#a2a4ae" stroke-width="1" marker-end="url(#arrow)"/>
      <path d="M 220,228 H 296" fill="none" stroke="#a2a4ae" stroke-width="1" marker-end="url(#arrow)"/>
      <path d="M 460,168 H 540" fill="none" stroke="#a2a4ae" stroke-width="1" marker-end="url(#arrow)"/>
      <path d="M 700,228 H 760" fill="none" stroke="#a2a4ae" stroke-width="1" marker-end="url(#arrow)"/>
      <path d="M 700,288 H 760" fill="none" stroke="#a2a4ae" stroke-width="1" marker-end="url(#arrow)"/>
      <path d="M 460,288 H 380 Q 364,288 364,304 V 320 Q 364,336 380,336 H 540" fill="none" stroke="#a2a4ae" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <path d="M 880,256 H 760 Q 744,256 744,272 V 292 Q 744,308 760,308 H 880" fill="none" stroke="#b3ee55" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
      <path d="M 940,348 H 940 V 412" fill="none" stroke="#a2a4ae" stroke-width="1" marker-end="url(#arrow)"/>

      <!-- Arrow labels -->
      <rect x="232" y="128" width="56" height="14" rx="2" fill="#08090e"/>
      <text x="260" y="138" fill="#7d8089" font-size="8" font-family="'JetBrains Mono', monospace" text-anchor="middle" letter-spacing="0.06em">SCOPE</text>

      <rect x="232" y="248" width="56" height="14" rx="2" fill="#08090e"/>
      <text x="260" y="258" fill="#7d8089" font-size="8" font-family="'JetBrains Mono', monospace" text-anchor="middle" letter-spacing="0.06em">UPLOAD</text>

      <rect x="476" y="152" width="48" height="14" rx="2" fill="#08090e"/>
      <text x="500" y="162" fill="#7d8089" font-size="8" font-family="'JetBrains Mono', monospace" text-anchor="middle" letter-spacing="0.06em">CHUNK</text>

      <rect x="710" y="212" width="48" height="14" rx="2" fill="#08090e"/>
      <text x="734" y="222" fill="#7d8089" font-size="8" font-family="'JetBrains Mono', monospace" text-anchor="middle" letter-spacing="0.06em">QUERY</text>

      <rect x="710" y="272" width="48" height="14" rx="2" fill="#08090e"/>
      <text x="734" y="282" fill="#7d8089" font-size="8" font-family="'JetBrains Mono', monospace" text-anchor="middle" letter-spacing="0.06em">TOP-K</text>

      <rect x="394" y="320" width="56" height="14" rx="2" fill="#08090e"/>
      <text x="422" y="330" fill="#7d8089" font-size="8" font-family="'JetBrains Mono', monospace" text-anchor="middle" letter-spacing="0.06em">PERMS</text>

      <rect x="804" y="180" width="64" height="14" rx="2" fill="#08090e"/>
      <text x="836" y="190" fill="#b3ee55" font-size="8" font-family="'JetBrains Mono', monospace" text-anchor="middle" letter-spacing="0.06em">ANSWER</text>

      <!-- Nodes -->
      <!-- 1. Slack sources -->
      <rect x="20" y="80" width="200" height="56" rx="6" fill="rgba(244,245,249,0.05)" stroke="rgba(244,245,249,0.30)" stroke-width="1"/>
      <rect x="28" y="88" width="36" height="14" rx="2" fill="transparent" stroke="rgba(244,245,249,0.25)" stroke-width="0.8"/>
      <text x="46" y="98" fill="rgba(244,245,249,0.65)" font-size="7" font-family="'JetBrains Mono', monospace" text-anchor="middle" letter-spacing="0.08em">EXT</text>
      <text x="120" y="116" fill="#f4f5f9" font-size="12" font-weight="600" font-family="'Space Grotesk', sans-serif" text-anchor="middle">Slack Channels</text>
      <text x="120" y="130" fill="#a2a4ae" font-size="9" font-family="'JetBrains Mono', monospace" text-anchor="middle">opt-in scope only</text>

      <!-- 2. Meeting transcripts -->
      <rect x="20" y="200" width="200" height="56" rx="6" fill="rgba(244,245,249,0.05)" stroke="rgba(244,245,249,0.30)" stroke-width="1"/>
      <rect x="28" y="208" width="36" height="14" rx="2" fill="transparent" stroke="rgba(244,245,249,0.25)" stroke-width="0.8"/>
      <text x="46" y="218" fill="rgba(244,245,249,0.65)" font-size="7" font-family="'JetBrains Mono', monospace" text-anchor="middle" letter-spacing="0.08em">EXT</text>
      <text x="120" y="236" fill="#f4f5f9" font-size="12" font-weight="600" font-family="'Space Grotesk', sans-serif" text-anchor="middle">Meeting Transcripts</text>
      <text x="120" y="250" fill="#a2a4ae" font-size="9" font-family="'JetBrains Mono', monospace" text-anchor="middle">upload · transcribe</text>

      <!-- 3. Ingest worker (focal) -->
      <rect x="296" y="120" width="164" height="96" rx="6" fill="rgba(179,238,85,0.12)" stroke="#b3ee55" stroke-width="1.2"/>
      <rect x="304" y="128" width="56" height="14" rx="2" fill="transparent" stroke="rgba(179,238,85,0.55)" stroke-width="0.8"/>
      <text x="332" y="138" fill="rgba(179,238,85,0.85)" font-size="7" font-family="'JetBrains Mono', monospace" text-anchor="middle" letter-spacing="0.08em">INGEST</text>
      <text x="378" y="168" fill="#b3ee55" font-size="12" font-weight="600" font-family="'Space Grotesk', sans-serif" text-anchor="middle">Ingest Worker</text>
      <text x="378" y="186" fill="#a2a4ae" font-size="9" font-family="'JetBrains Mono', monospace" text-anchor="middle">chunk · embed</text>
      <text x="378" y="200" fill="#a2a4ae" font-size="9" font-family="'JetBrains Mono', monospace" text-anchor="middle">scope per tenant</text>

      <!-- 4. pgvector index -->
      <rect x="540" y="120" width="160" height="96" rx="6" fill="rgba(244,245,249,0.05)" stroke="rgba(244,245,249,0.30)" stroke-width="1"/>
      <rect x="548" y="128" width="56" height="14" rx="2" fill="transparent" stroke="rgba(244,245,249,0.25)" stroke-width="0.8"/>
      <text x="576" y="138" fill="rgba(244,245,249,0.65)" font-size="7" font-family="'JetBrains Mono', monospace" text-anchor="middle" letter-spacing="0.08em">STORE</text>
      <text x="620" y="166" fill="#f4f5f9" font-size="12" font-weight="600" font-family="'Space Grotesk', sans-serif" text-anchor="middle">pgvector</text>
      <text x="620" y="184" fill="#a2a4ae" font-size="9" font-family="'JetBrains Mono', monospace" text-anchor="middle">per-tenant schema</text>
      <text x="620" y="198" fill="#a2a4ae" font-size="9" font-family="'JetBrains Mono', monospace" text-anchor="middle">+ permission metadata</text>

      <!-- 5. Retrieval -->
      <rect x="540" y="280" width="160" height="56" rx="6" fill="#0f1119" stroke="#f4f5f9" stroke-width="1"/>
      <rect x="548" y="288" width="56" height="14" rx="2" fill="transparent" stroke="rgba(244,245,249,0.40)" stroke-width="0.8"/>
      <text x="576" y="298" fill="rgba(244,245,249,0.65)" font-size="7" font-family="'JetBrains Mono', monospace" text-anchor="middle" letter-spacing="0.08em">RETRIEVE</text>
      <text x="620" y="314" fill="#f4f5f9" font-size="12" font-weight="600" font-family="'Space Grotesk', sans-serif" text-anchor="middle">Retrieval</text>

      <!-- 6. Permission filter -->
      <rect x="380" y="356" width="160" height="56" rx="6" fill="#0f1119" stroke="#f4f5f9" stroke-width="1"/>
      <rect x="388" y="364" width="56" height="14" rx="2" fill="transparent" stroke="rgba(244,245,249,0.40)" stroke-width="0.8"/>
      <text x="416" y="374" fill="rgba(244,245,249,0.65)" font-size="7" font-family="'JetBrains Mono', monospace" text-anchor="middle" letter-spacing="0.08em">GATE</text>
      <text x="460" y="390" fill="#f4f5f9" font-size="12" font-weight="600" font-family="'Space Grotesk', sans-serif" text-anchor="middle">Permission Filter</text>

      <!-- 7. Claude synthesis -->
      <rect x="760" y="200" width="200" height="100" rx="6" fill="#0f1119" stroke="#f4f5f9" stroke-width="1"/>
      <rect x="768" y="208" width="56" height="14" rx="2" fill="transparent" stroke="rgba(244,245,249,0.40)" stroke-width="0.8"/>
      <text x="796" y="218" fill="rgba(244,245,249,0.65)" font-size="7" font-family="'JetBrains Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SYNTH</text>
      <text x="860" y="248" fill="#f4f5f9" font-size="12" font-weight="600" font-family="'Space Grotesk', sans-serif" text-anchor="middle">Claude Synthesis</text>
      <text x="860" y="266" fill="#a2a4ae" font-size="9" font-family="'JetBrains Mono', monospace" text-anchor="middle">answer + citations</text>
      <text x="860" y="280" fill="#a2a4ae" font-size="9" font-family="'JetBrains Mono', monospace" text-anchor="middle">verbatim quote per citation</text>

      <!-- 8. User -->
      <rect x="880" y="348" width="100" height="48" rx="6" fill="rgba(244,245,249,0.05)" stroke="rgba(244,245,249,0.30)" stroke-width="1"/>
      <text x="930" y="368" fill="#f4f5f9" font-size="12" font-weight="600" font-family="'Space Grotesk', sans-serif" text-anchor="middle">User Question</text>
      <text x="930" y="384" fill="#a2a4ae" font-size="9" font-family="'JetBrains Mono', monospace" text-anchor="middle">team member</text>

      <!-- 9. Answer back to user -->
      <rect x="880" y="412" width="100" height="48" rx="6" fill="rgba(244,245,249,0.05)" stroke="rgba(244,245,249,0.30)" stroke-width="1"/>
      <text x="930" y="432" fill="#f4f5f9" font-size="12" font-weight="600" font-family="'Space Grotesk', sans-serif" text-anchor="middle">Answer + Citations</text>

      <!-- Legend -->
      <line x1="40" y1="488" x2="960" y2="488" stroke="rgba(244,245,249,0.10)" stroke-width="0.8"/>
      <text x="40" y="504" fill="#a2a4ae" font-size="8" font-family="'JetBrains Mono', monospace" letter-spacing="0.18em">LEGEND</text>
      <line x1="120" y1="501" x2="144" y2="501" stroke="#b3ee55" stroke-width="1.2"/>
      <text x="152" y="505" fill="#a2a4ae" font-size="8.5" font-family="'Space Grotesk', sans-serif">Primary answer path</text>
      <line x1="320" y1="501" x2="344" y2="501" stroke="#a2a4ae" stroke-width="1"/>
      <text x="352" y="505" fill="#a2a4ae" font-size="8.5" font-family="'Space Grotesk', sans-serif">Ingest / query flow</text>
      <line x1="500" y1="501" x2="524" y2="501" stroke="#a2a4ae" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="532" y="505" fill="#a2a4ae" font-size="8.5" font-family="'Space Grotesk', sans-serif">Permission re-check (hard gate)</text>
      <rect x="780" y="494" width="24" height="14" rx="3" fill="rgba(179,238,85,0.12)" stroke="#b3ee55" stroke-width="1.2"/>
      <text x="812" y="505" fill="#a2a4ae" font-size="8.5" font-family="'Space Grotesk', sans-serif">Ingest worker (focal)</text>
    </svg>
  </div>
</body>
</html>
