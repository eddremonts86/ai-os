# Graphiti MCP Server Configuration — AI-OS, MiniMax as LLM provider
#
# Decision (2026-07-13): use MiniMax instead of OpenAI for entity extraction.
# Confirmed MiniMax exposes a real OpenAI-compatible /v1/chat/completions
# endpoint, per MiniMax's own LiteLLM integration docs — "You can use
# MiniMax's OpenAI-compatible API directly". Graphiti's config.yaml schema
# (fetched from the real upstream source, not the simplified README example)
# lets any provider impersonate "openai" by overriding
# `llm.providers.openai.api_url` — this is the exact same mechanism the
# official docs use for local Ollama models. No code changes needed in
# Graphiti itself.
#
# Real credentials (from /Users/edd/Projects/configs/env.ts, 2026-07-13):
# this Mac's actual MiniMax account uses the international endpoint
# https://api.minimaxi.chat/v1 (NOT api.minimax.io — both may work, but this
# is the one this specific account/key is confirmed against) and model
# MiniMax-M3 (not M2.1 — the LiteLLM docs example model doesn't apply here).
#
# Embeddings: MiniMax is NOT one of Graphiti's supported embedder providers
# (openai, azure_openai, gemini, voyage). Rather than depend on an unverified
# MiniMax embeddings endpoint, this reuses the Ollama + nomic-embed-text
# instance AI-OS already runs locally for the rest of the memory stack (same
# "openai-compatible override" trick, pointed at Ollama's own OpenAI-
# compatible API). Reached via `host.docker.internal` since Ollama runs as a
# host process, not inside the `aios-memory` Docker network.
#
# STATUS (2026-07-13, UPDATE — WIRING CONFIRMED WORKING): Docker Hub has no
# newer zepai/knowledge-graph-mcp tag (latest == 1.0.2, identical digest,
# confirmed via Docker Hub's API) that includes the custom-`api_url` fix, so
# the image was built FROM SOURCE instead — see docker-compose.yml's image
# comment for the exact build recipe (uses memory/graphiti/Dockerfile.standalone.minimal,
# a trimmed copy of getzep/graphiti main's Dockerfile.standalone that skips
# the `providers`/`azure` extras to avoid a ~3GB unused PyTorch+CUDA download
# from sentence-transformers).
#
# Tested end-to-end with the real MiniMax key from
# /Users/edd/Projects/configs/env.ts via manual MCP protocol calls
# (initialize -> notifications/initialized -> tools/call add_memory over the
# streamable-HTTP endpoint). Real container logs confirm the request now
# genuinely reaches MiniMax: `POST https://api.minimaxi.chat/v1/chat/completions`
# via `graphiti_core.llm_client.openai_generic_client` (the correct client for
# custom endpoints — confirms `is_non_openai_provider()` correctly detected
# the override and routed away from OpenAI's real Responses API). The
# MiniMax → OpenAI wiring problem is FULLY RESOLVED.
#
# UPDATE (2026-07-13, later same day): Edd provided a fresh MINIMAX_API_KEY.
# Confirmed valid directly against MiniMax's endpoint (HTTP 200). The old
# 401 is gone. TWO further compatibility issues then surfaced and were fixed
# by patching the custom image (see Dockerfile.standalone.minimal +
# patches/strip_think_tags.py for the full rationale/diffs):
#
# 1. MiniMax-M3 (and M2) are reasoning models that ALWAYS prepend a
#    `<think>...</think>` block to their content, even under a JSON
#    response_format (`usage.reasoning_tokens` is always present). graphiti-
#    core's `OpenAIGenericClient._strip_code_fences` only strips ```json
#    fences, not <think> blocks, so `json.loads()` failed with `Expecting
#    value: line 1 column 1 (char 0)` despite the HTTP request itself
#    succeeding (200 OK). FIX: patches/strip_think_tags.py patches the
#    installed graphiti-core (pulled from PyPI, pinned to 0.29.2 — note 0.29.1
#    predates the `_strip_code_fences` method entirely) to also strip a
#    leading <think>...</think> block before parsing.
#
# 2. graphiti-core's default `structured_output_mode` is "json_schema", which
#    sends `response_model.model_json_schema()` as-is. Pydantic emits nested
#    models (e.g. `ExtractedEntities.extracted_entities: list[ExtractedEntity]`)
#    as a `$ref`-only "items" schema with no explicit "type" key. MiniMax's
#    json_schema validator is stricter than OpenAI's about this and rejects it
#    with 400 "property 'extracted_entities[]' type '' invalid". FIX: patched
#    mcp_server's `LLMClientFactory.create` (local project source, not PyPI —
#    no image-layer patch needed) to force `structured_output_mode='json_object'`
#    for any non-OpenAI provider (`use_generic_client=True`), which injects the
#    schema into the prompt instead of enforcing it via the API.
#
# Non-reasoning model MiniMax-Text-01 was tried as a simpler alternative (no
# <think> wrapping) but rejects response_format:"json_object" outright (400
# "unknown response_format type") and its default json_schema mode still hits
# issue #2 above — so it doesn't avoid the need for these patches either.
# Models abab6.5-chat / abab6.5s-chat no longer exist on this account (400
# "unknown model"). With both patches, end-to-end add_memory succeeded with
# MiniMax-M3 — episode queued, processed, and written to FalkorDB with no
# errors in the container logs.
#
# COMPREHENSIVE TEST ROUND (2026-07-13, same day, "pruébalo todo"): tested
# every MCP tool, not just add_memory.
#   - health, search_nodes, search_memory_facts, get_episodes: all work
#     PERFECTLY, and (contrary to the assumption below) do NOT appear to need
#     the hardcoded-OpenAI reranker for typical small result sets — tested
#     with only a placeholder OPENAI_API_KEY and got fully correct,
#     well-formed results every time.
#   - add_memory reliability: NOT 100%. Across ~6 test calls, roughly half
#     still failed outright with two MORE MiniMax quirks found this round,
#     neither retried by the current predicate:
#       (a) the model sometimes returns ONLY a <think> block with nothing
#           after it — post-strip the content is empty, raising
#           EmptyResponseError (this IS retried, but the retry can hit (b))
#       (b) the model sometimes returns a bare JSON *array* instead of the
#           expected JSON *object* — fails with a TypeError
#           ("...ExtractedEntities() argument after ** must be a mapping,
#           not list"), which is neither a JSONDecodeError nor a
#           ValidationError, so it is NOT retried and the episode fails.
#   3rd patch added to patches/strip_think_tags.py: retry on pydantic
#   ValidationError too (covers the earlier "schema echoed back instead of
#   data" failure mode), which helps but doesn't close the (a)/(b) gap above.
#   Net assessment: MiniMax-M3 in forced json_object mode is genuinely
#   unreliable for structured extraction — a MODEL CAPABILITY limitation, not
#   a bug in this integration. Retrying a failed add_memory call with the
#   same content succeeds often enough to be usable, but do not expect 100%
#   first-try success.
#
# REMAINING (unchanged): the hardcoded OpenAIRerankerClient still needs a real
# OPENAI_API_KEY for `search` specifically; `add_memory` does not need it.
#
# HARD LIMITATION FOUND (separate issue, same session): graphiti-core 1.0.2 (pinned in this image) also
# instantiates a THIRD component — a cross-encoder/reranker
# (graphiti_core/cross_encoder/openai_reranker_client.py) — with
# `OpenAIRerankerClient()` and NO arguments. That call reads `OPENAI_API_KEY`
# straight from the openai SDK's own env-var fallback and hardcodes OpenAI's
# real base URL (`config.base_url` stays `None`, and the openai SDK defaults
# to `https://api.openai.com/v1` when base_url is None). This is NOT wired
# through config.yaml at all in this version — the MCP server
# (`graphiti_mcp_server.py`) never passes `cross_encoder=` to `Graphiti()`.
# There is no config.yaml key or env var that redirects it to MiniMax.
#
# Practical effect: `add_memory` (writes/entity-extraction) uses only the LLM
# + embedder above, so MiniMax + local Ollama should cover it. `search`
# (reads) additionally reranks results through this hardcoded OpenAI client,
# so search calls will fail with an OpenAI auth error unless a real
# OPENAI_API_KEY is ALSO set — these are single-token classifier calls on
# gpt-4.1-nano (cheap), just not free the way the rest of this setup is.

server:
  transport: "http"
  host: "0.0.0.0"
  port: 8000

llm:
  provider: "openai" # MiniMax impersonates "openai" via a custom api_url — same trick as the official Ollama example. Confirmed working with the custom-built image (see STATUS note above).
  model: ${MINIMAX_MODEL:MiniMax-M3} # reasoning model — safe again now the image patches force json_object mode and strip <think> blocks, see STATUS note above
  max_tokens: 16384 # M3's <think> reasoning counts against the same completion budget as the final JSON answer (MiniMax bills it as "reasoning_tokens", same pattern as OpenAI o1/o3) — 4096 was too small and caused truncated/malformed JSON ("Unterminated string", "Extra data") on the larger fact/edge-extraction schema specifically
  providers:
    openai:
      api_key: ${MINIMAX_API_KEY}
      api_url: ${MINIMAX_BASE_URL:https://api.minimaxi.chat/v1}

embedder:
  provider: "openai" # Ollama (local, already running for the rest of the AI-OS memory stack) impersonates "openai" the same way
  model: ${EMBEDDER_MODEL:nomic-embed-text}
  dimensions: 768 # nomic-embed-text's native dimension (not OpenAI's 1536)
  providers:
    openai:
      api_key: "ollama" # dummy — Ollama's OpenAI-compatible endpoint doesn't check it
      api_url: "http://host.docker.internal:11500/v1"

database:
  provider: "falkordb"
  providers:
    falkordb:
      uri: ${FALKORDB_URI:redis://aios-falkordb:6379}
      password: ${FALKORDB_PASSWORD:}
      database: ${FALKORDB_DATABASE:default_db}

graphiti:
  group_id: ${GRAPHITI_GROUP_ID:main}
  user_id: ${USER_ID:mcp_user}
  entity_types:
    - name: "Preference"
      description: "User preferences, choices, opinions, or selections (PRIORITIZE over most other types except User/Assistant)"
    - name: "Requirement"
      description: "Specific needs, features, or functionality that must be fulfilled"
    - name: "Procedure"
      description: "Standard operating procedures and sequential instructions"
    - name: "Location"
      description: "Physical or virtual places where activities occur"
    - name: "Event"
      description: "Time-bound activities, occurrences, or experiences"
    - name: "Organization"
      description: "Companies, institutions, groups, or formal entities"
    - name: "Document"
      description: "Information content in various forms (books, articles, reports, etc.)"
    - name: "Topic"
      description: "Subject of conversation, interest, or knowledge domain (use as last resort)"
    - name: "Person"
      description: "An individual human referenced in the content"
    - name: "Object"
      description: "Physical items, tools, devices, or possessions (use as last resort)"
