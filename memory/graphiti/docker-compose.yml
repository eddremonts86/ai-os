# Graphiti MCP server — AI-OS memory stack (Task 3, Graphiti architecture decision)
#
# Decision (2026-07-12, this session): run the pre-built `zepai/knowledge-graph-mcp`
# image in its "-standalone" variant (no bundled database) against the FalkorDB
# instance already managed by memory/falkordb/docker-compose.yml, connected over
# the shared `aios-memory` Docker network. Chosen over vendoring
# github.com/getzep/graphiti under vendor/graphiti/ because it avoids taking on a
# second language toolchain (uv/Python) and a git-submodule-style dependency just
# to run one MCP server — the versioned Docker image is pinned exactly the same
# way FalkorDB itself already is.
#
# Image tag pinned to a specific release (not `:latest`); see
# https://hub.docker.com/r/zepai/knowledge-graph-mcp/tags to bump.
#
# STATUS: structural smoke test PASSED on 2026-07-12 — started this alongside
# FalkorDB on the shared `aios-memory` network with a placeholder
# OPENAI_API_KEY, confirmed the server logs "Successfully initialized Graphiti
# client" + FalkorDB index checks succeeded, and
# `curl -sf http://127.0.0.1:8021/health` returned
# `{"status":"healthy","service":"graphiti-mcp"}`. The test container was torn
# down afterward (`docker compose down`) since its key was a placeholder.
# ai-config/mcp/graphiti.yaml's `enabled` is now `true` on the strength of this.
# This only proves the DEPLOYMENT path (Docker/network/FalkorDB/HTTP) works —
# it does NOT prove actual knowledge-graph operations, which need a real
# OPENAI_API_KEY to call OpenAI for entity extraction.
#
# To activate for real use:
#   1. export OPENAI_API_KEY=sk-...          # a REAL key — or edit environment: below for another provider
#   2. cd ~/Projects/ai-os/memory/falkordb && docker compose up -d   # FalkorDB must be up first
#   3. cd ~/Projects/ai-os/memory/graphiti && docker compose up -d
#   4. curl -sf http://127.0.0.1:8021/health && echo OK
#   5. Try a real add_memory/search call through an MCP client to confirm
#      actual entity extraction works (the structural test above does not
#      cover this).

networks:
  aios-memory:
    external: true   # created by memory/falkordb/docker-compose.yml

services:
  graphiti-mcp:
    image: zepai/knowledge-graph-mcp:1.0.2-standalone
    container_name: aios-graphiti-mcp
    restart: unless-stopped
    networks:
      - aios-memory
    depends_on: []  # FalkorDB lives in a separate compose project; start it first manually
    ports:
      - "127.0.0.1:8021:8000"   # HTTP transport, MCP endpoint at /mcp/
    environment:
      DATABASE_PROVIDER: falkordb
      FALKORDB_URI: redis://aios-falkordb:6379   # reach FalkorDB by container name on aios-memory
      OPENAI_API_KEY: ${OPENAI_API_KEY:?set OPENAI_API_KEY before starting this service}
      GRAPHITI_TELEMETRY_ENABLED: "false"
      SEMAPHORE_LIMIT: "5"   # conservative default; raise per the tuning table in graphiti's mcp_server/README.md

# Usage:
#   cd ~/Projects/ai-os/memory/graphiti
#   docker compose up -d        # start (FalkorDB must already be running)
#   docker compose down         # stop
#   docker compose logs -f      # logs
#
# Quick check:
#   curl -sf http://127.0.0.1:8021/health && echo OK
