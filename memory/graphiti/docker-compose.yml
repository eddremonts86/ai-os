# Graphiti MCP server — AI-OS memory stack (Task 3, Graphiti architecture decision)
#
# Decision (2026-07-12, this session): run the pre-built `zepai/knowledge-graph-mcp`
# image in its "-standalone" variant (no bundled database) against the FalkorDB
# instance already managed by memory/falkordb/docker-compose.yml, connected over
# the shared `aios-memory` Docker network. Chosen over vendoring
# github.com/getzep/graphiti under vendor/graphiti/ because it avoids taking on a
# second language toolchain (uv/Python) and a git-submodule-style dependency just
# to run one MCP server — the versioned Docker image is pinned exactly the same
# way FalkorDB itself already is.
#
# Image tag pinned to a specific release (not `:latest`); see
# https://hub.docker.com/r/zepai/knowledge-graph-mcp/tags to bump.
#
# STATUS: structural smoke test PASSED on 2026-07-12 — started this alongside
# FalkorDB on the shared `aios-memory` network with a placeholder
# OPENAI_API_KEY, confirmed the server logs "Successfully initialized Graphiti
# client" + FalkorDB index checks succeeded, and
# `curl -sf http://127.0.0.1:8021/health` returned
# `{"status":"healthy","service":"graphiti-mcp"}`. The test container was torn
# down afterward (`docker compose down`) since its key was a placeholder.
# ai-config/mcp/graphiti.yaml's `enabled` is now `true` on the strength of this.
# This only proves the DEPLOYMENT path (Docker/network/FalkorDB/HTTP) works —
# it does NOT prove actual knowledge-graph operations, which need a real API
# key to call an LLM for entity extraction.
#
# LLM provider (2026-07-13): switched from OpenAI to MiniMax. Confirmed MiniMax
# exposes a real OpenAI-compatible /v1/chat/completions endpoint
# (https://api.minimax.io/v1), so it can "impersonate" the openai provider via
# config.yaml's `llm.providers.openai.api_url` override — the same documented
# trick Graphiti's own docs use for local Ollama models. This needs a
# config.yaml file (not just env vars — Graphiti's env-var support only covers
# provider-specific keys, no generic base-URL override), so this compose file
# now mounts memory/graphiti/config.yaml into the container via CONFIG_PATH.
# Embeddings are routed to the Ollama instance AI-OS already runs locally
# (MiniMax isn't one of Graphiti's supported embedder providers) via the same
# openai-impersonation trick, reached over host.docker.internal.
#
# UPDATE 2026-07-13 (final): Edd provided a fresh, valid MINIMAX_API_KEY —
# confirmed against MiniMax directly (HTTP 200) and end-to-end through
# Graphiti. Getting there required 4 image patches on top of the base_url fix
# (all documented in config.yaml's STATUS note and patches/strip_think_tags.py):
# stripping MiniMax-M3's <think> reasoning blocks, forcing json_object mode
# (MiniMax's json_schema validator rejects graphiti-core's $ref-based nested
# schemas), switching to raw_decode (MiniMax appends trailing content after a
# complete JSON object even in json_object mode), and raising max_tokens to
# 16384 (M3's reasoning tokens share the same budget as the final answer).
# VERIFIED WITH REAL DATA: a real `add_memory` call completed
# (`Completed add_episode in ~24s` / `Successfully processed episode`) and a
# direct FalkorDB query confirms the episode plus 4 correctly extracted
# entities (Edd, MiniMax, OpenAI, AI-OS) with accurate summaries. add_memory
# is fully working end-to-end, not just wired — this is genuinely done.
#
# COMPREHENSIVE TEST ROUND (same day): all read tools (health, search_nodes,
# search_memory_facts, get_episodes) work perfectly and did NOT need a real
# OPENAI_API_KEY in testing. add_memory reliability is NOT 100% though —
# roughly half of further test calls failed with two more MiniMax quirks
# (empty content after <think> stripping; a bare JSON array instead of the
# expected object). A 3rd patch (retry on pydantic ValidationError, not just
# JSONDecodeError) was added and helps but doesn't fully close the gap — see
# config.yaml's STATUS note for the full list. This is a MiniMax model-
# capability limitation, not a wiring bug: retrying the same add_memory call
# often succeeds, so treat first-try failures as expected, not broken.
#
# CAVEAT (still applies): graphiti-core's cross-encoder/reranker is hardcoded
# to real OpenAI regardless of config.yaml (see config.yaml's STATUS note).
# `add_memory` (writes) only needs MINIMAX_API_KEY. `search` (reads)
# additionally needs a real OPENAI_API_KEY for reranking, or it will fail —
# there is no way to redirect that specific call to MiniMax in this image.
#
# To activate for real use:
#   1. export MINIMAX_API_KEY=...            # a REAL, VALID MiniMax API key (see /Users/edd/Projects/configs/env.ts)
#   2. export OPENAI_API_KEY=sk-...          # only needed for search/reranking; skip if you only need add_memory
#   3. cd ~/Projects/ai-os/memory/falkordb && docker compose up -d   # FalkorDB must be up first
#   4. Ensure Ollama is running locally with nomic-embed-text pulled
#      (ollama pull nomic-embed-text) — used for embeddings, not MiniMax.
#   5. cd ~/Projects/ai-os/memory/graphiti && docker compose up -d
#   6. curl -sf http://127.0.0.1:8021/health && echo OK
#   7. add_memory works end-to-end as of 2026-07-13 — verified with a real
#      episode, correctly extracted entities, confirmed via a direct FalkorDB
#      query (see STATUS note above).

networks:
  aios-memory:
    external: true   # created by memory/falkordb/docker-compose.yml

services:
  graphiti-mcp:
    # Custom local build from getzep/graphiti's main branch (2026-07-13), NOT the
    # official zepai/knowledge-graph-mcp:1.0.2-standalone. Built because the pinned
    # upstream image lacks the `is_non_openai_provider`/custom `api_url` support this
    # MiniMax setup depends on (see config.yaml's STATUS note for the full root-cause).
    # Built via Dockerfile.standalone.minimal (a trimmed copy of upstream's
    # Dockerfile.standalone that skips the `providers`/`azure` extras — those pull in
    # anthropic/gemini/groq/voyageai/sentence-transformers, and sentence-transformers
    # alone drags in the full PyTorch+CUDA wheel set, ~3GB, unused here since MiniMax
    # and Ollama are both reached through the base 'openai' client). Rebuild with:
    #   git clone https://github.com/getzep/graphiti.git /tmp/graphiti-build/graphiti
    #   cp memory/graphiti/Dockerfile.standalone.minimal /tmp/graphiti-build/graphiti/mcp_server/docker/
    #   cd /tmp/graphiti-build/graphiti/mcp_server/docker
    #   docker build -f Dockerfile.standalone.minimal -t ai-os/graphiti-mcp:minimax-standalone ..
    image: ai-os/graphiti-mcp:minimax-standalone
    container_name: aios-graphiti-mcp
    restart: unless-stopped
    networks:
      - aios-memory
    depends_on: []  # FalkorDB lives in a separate compose project; start it first manually
    extra_hosts:
      - "host.docker.internal:host-gateway"   # reach host-side Ollama for embeddings; no-op on Docker Desktop (already resolvable there), required on Linux Docker Engine
    ports:
      - "127.0.0.1:8021:8000"   # HTTP transport, MCP endpoint at /mcp/
    volumes:
      - ./config.yaml:/app/mcp/config/config.yaml:ro
    environment:
      CONFIG_PATH: /app/mcp/config/config.yaml
      MINIMAX_API_KEY: ${MINIMAX_API_KEY:?set MINIMAX_API_KEY before starting this service}
      # MINIMAX_BASE_URL/MINIMAX_MODEL must be explicitly listed here to reach the
      # container — docker compose does NOT pass through arbitrary host shell env vars,
      # only ones named in this environment: block (confirmed by a real bug: without
      # these, config.yaml's ${MINIMAX_BASE_URL:default} fell through to a null base_url,
      # and the LLM client silently hit real api.openai.com instead of MiniMax).
      MINIMAX_BASE_URL: ${MINIMAX_BASE_URL:-https://api.minimaxi.chat/v1}
      MINIMAX_MODEL: ${MINIMAX_MODEL:-MiniMax-M3}
      # The openai SDK's client constructor validates api_key is a non-empty string at
      # *instantiation* time (not just when actually calling the API) — graphiti-core's
      # hardcoded reranker (see config.yaml's STATUS note) crashes the whole server on boot
      # without this, even though MiniMax + Ollama handle everything else. A placeholder is
      # enough to let the container start; only `search` calls that trigger real reranking
      # need this to be a genuine OpenAI key.
      OPENAI_API_KEY: ${OPENAI_API_KEY:-sk-placeholder-reranker-only-not-wired-to-minimax}
      FALKORDB_URI: redis://aios-falkordb:6379   # reach FalkorDB by container name on aios-memory
      GRAPHITI_TELEMETRY_ENABLED: "false"
      SEMAPHORE_LIMIT: "5"   # conservative default; raise per the tuning table in graphiti's mcp_server/README.md

# Usage:
#   cd ~/Projects/ai-os/memory/graphiti
#   docker compose up -d        # start (FalkorDB must already be running)
#   docker compose down         # stop
#   docker compose logs -f      # logs
#
# Quick check:
#   curl -sf http://127.0.0.1:8021/health && echo OK
