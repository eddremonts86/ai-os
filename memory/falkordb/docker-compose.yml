# FalkorDB — AI-OS memory stack (phase 1, Task 1.3)
#
# Ports are intentionally OUTSIDE the 3000-3050 range (Edd's other apps use those).
# Edit here only. Do NOT change ports from outside without updating:
#   - this file
#   - dev-env/.env.example
#
# Web UI:   http://127.0.0.1:3300  (browser, login not required by default)
# Redis:   127.0.0.1:6390  (wire protocol)
# Volume:  ./data  (persistent across `docker compose down && up`)

services:
  falkordb:
    image: falkordb/falkordb:v4.18.11
    container_name: aios-falkordb
    restart: unless-stopped
    ports:
      - "127.0.0.1:6390:6379"   # Redis protocol
      - "127.0.0.1:3300:3000"   # Web UI / Browser (FalkorDB inspector)
    volumes:
      - ./data:/data  # FalkorDB persists to /data by default
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "6379", "PING"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

# Usage:
#   cd ~/Projects/ai-os/memory/falkordb
#   docker compose up -d        # start
#   docker compose down         # stop (data persists in ./data)
#   docker compose logs -f      # logs
#
# Quick check:
#   redis-cli -p 6390 PING                      # → PONG
#   curl -sI http://localhost:3300/ | head -1   # → HTTP/1.1 200 OK
