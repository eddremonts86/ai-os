# FalkorDB — AI-OS memory stack (phase 1, Task 1.3)
#
# Ports are intentionally OUTSIDE the 3000-3050 range (Edd's other apps use those).
# Edit here only. Do NOT change ports from outside without updating:
#   - this file
#   - dev-env/.env.example
#
# Web UI:   http://127.0.0.1:3300  (browser, login not required by default)
# Redis:   127.0.0.1:6390  (wire protocol)
# Volume:  ./data  (persistent across `docker compose down && up`)
#
# Ollama (optional, profile "ollama-docker"): containerized alternative to a
# native `ollama serve` install. Opt-in via `--profile ollama-docker` -- plain
# `docker compose up -d` never touches it. Windows uses this by default
# (`choco install ollama` needs admin and was unreliable without it); Mac
# defaults to native `brew install ollama` for Apple Silicon Metal GPU accel,
# which containers can't access. Same port (11500) either way, so grepai and
# codebase-memory-mcp never know or care which backend is running.

networks:
  aios-memory:
    name: aios-memory # shared with memory/graphiti/docker-compose.yml so the
# Graphiti MCP container can reach FalkorDB by service
# name over the internal Docker network (not the
# loopback-only published port).

services:
  falkordb:
    image: falkordb/falkordb:v4.18.11
    container_name: aios-falkordb
    restart: unless-stopped
    networks:
      - aios-memory
    ports:
      - "127.0.0.1:6390:6379" # Redis protocol
      - "127.0.0.1:3300:3000" # Web UI / Browser (FalkorDB inspector)
    volumes:
      - ./data:/data # FalkorDB persists to /data by default
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "6379", "PING"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  ollama:
    image: ollama/ollama:0.6.8 # pinned, kept in sync with the native version installers pull
    container_name: aios-ollama
    profiles:
      - ollama-docker # opt-in only; `docker compose up -d` alone skips this
    restart: unless-stopped
    networks:
      - aios-memory
    ports:
      - "127.0.0.1:11500:11434" # same AI-OS port convention as native installs
    volumes:
      - ./ollama-data:/root/.ollama # persists pulled models across restarts
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

# Usage:
#   cd ~/Projects/ai-os/memory/falkordb
#   docker compose up -d                          # start FalkorDB only
#   docker compose --profile ollama-docker up -d  # start FalkorDB + Ollama
#   docker compose down                           # stop (data persists)
#   docker compose logs -f                        # logs
#   docker exec aios-ollama ollama pull nomic-embed-text  # pull the embed model
#
# Quick check:
#   redis-cli -p 6390 PING                      # → PONG
#   curl -sI http://localhost:3300/ | head -1   # → HTTP/1.1 200 OK
#   curl -s http://localhost:11500/api/tags     # → Ollama models JSON (if ollama-docker profile is up)
