<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:SG;src:url(space-grotesk-latin-wght-normal.woff2)format("woff2");font-weight:300 700}
@font-face{font-family:JB;src:url(jetbrains-mono-latin-wght-normal.woff2)format("woff2");font-weight:100 800}
:root{--bg:#08090e;--panel:#0f1119;--ink:#f4f5f9;--muted:#a2a4ae;--faint:#72747d;--line:#2b2d38;--acid:#b3ee55;--acidtint:rgba(179,238,85,.10)}
body.light{--bg:#f4f5f9;--panel:#e9eaf1;--ink:#08090e;--muted:#53555d;--faint:#61636b;--line:#c9cbd6;--acid:#4f7800;--acidtint:rgba(179,238,85,.22)}
*{margin:0;box-sizing:border-box}
body{width:1280px;height:440px;background:var(--bg);color:var(--ink);font-family:SG;overflow:hidden;position:relative}
.grid{position:absolute;inset:0;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:40px 40px;opacity:.35;mask-image:radial-gradient(ellipse at 75% 50%,#000 10%,transparent 70%)}
.left{position:absolute;left:72px;top:64px;width:600px}
.mark{font-weight:700;font-size:96px;letter-spacing:-.04em;line-height:1}
.mark b{color:var(--acid);font-weight:700}
.tag{margin-top:22px;font-size:27px;line-height:1.3;color:var(--ink);font-weight:500;max-width:560px}
.sub{margin-top:14px;font-size:18px;color:var(--muted);line-height:1.45;max-width:540px}
.cmd{margin-top:30px;display:inline-flex;gap:14px;align-items:center;font-family:JB;font-size:19px;padding:14px 20px;border:1px solid var(--line);background:var(--panel);border-radius:10px}
.cmd i{color:var(--acid);font-style:normal}
svg{position:absolute;right:56px;top:46px}
.t{font-family:JB;font-size:14px;fill:var(--ink)}.s{font-family:JB;font-size:12px;fill:var(--muted)}
</style></head><body><div class="grid"></div>
<div class="left"><div class="mark">AI<b>-</b>OS</div>
<div class="tag">Your AI coding setup, back on any machine with one command.</div>
<div class="sub">Skills, agents, rules, memory and MCP servers, wired into every AI CLI you use. Spec, verify, ship.</div>
<div class="cmd"><i>$</i>npx @edd_remonts/create-ai-os</div></div>
<svg width="520" height="350" viewBox="0 0 520 350" role="img" aria-label="One repo feeds one installer, which wires six AI CLIs">
<defs><marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8z" fill="var(--acid)"/></marker></defs>
<rect x="10" y="135" width="130" height="64" rx="10" fill="var(--panel)" stroke="var(--acid)" stroke-width="1.5"/>
<text x="75" y="163" text-anchor="middle" class="t">ai-os repo</text><text x="75" y="183" text-anchor="middle" class="s">source of truth</text>
<line x1="140" y1="167" x2="190" y2="167" stroke="var(--acid)" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="195" y="135" width="120" height="64" rx="10" fill="var(--acidtint)" stroke="var(--acid)" stroke-width="1.5"/>
<text x="255" y="163" text-anchor="middle" class="t">installer</text><text x="255" y="183" text-anchor="middle" class="s">pick or --full</text>
<g id="clis"></g>
</svg>
<script>
const clis=["Claude Code","Codex","Gemini CLI","opencode","Antigravity","Hermes"];const g=document.getElementById('clis');
clis.forEach((c,i)=>{const y=12+i*56;g.insertAdjacentHTML('beforeend',`<path d="M315 167 C 345 167, 345 ${y+22}, 372 ${y+22}" fill="none" stroke="var(--acid)" stroke-width="1.2" opacity=".75" marker-end="url(#a)"/><rect x="378" y="${y}" width="132" height="44" rx="8" fill="var(--panel)" stroke="var(--line)"/><text x="444" y="${y+27}" text-anchor="middle" class="t">${c}</text>`)});
</script></body></html>
